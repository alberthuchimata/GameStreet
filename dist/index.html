<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07061e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Miami Fighter">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Miami Fighter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{box-sizing:border-box}
  *,*::before,*::after{box-sizing:inherit}
  html,body{height:100%;height:100dvh;margin:0;background:#000;overflow:hidden;overscroll-behavior:none}
  body{display:grid;place-items:center;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:min(100vw,calc(100dvh * 16 / 9));height:auto;aspect-ratio:16/9;background:#000;touch-action:none;cursor:pointer}
  @supports not (height:100dvh){canvas{width:min(100vw,calc(100vh * 16 / 9))}}
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Miami Fighter"></canvas>
<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
